[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a separate PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
"app/dependencies.py" = ["B008"]
