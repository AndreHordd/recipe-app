{% extends "base.html" %}
{% block content %}
<section class="intro">
  <h1>Кулінарні рецепти</h1>
  <p>Опубліковані рецепти нашої спільноти.</p>
</section>
<form id="search-form" class="panel search-form" method="get">
  <div class="form-columns">
    <div><label for="search-mode">Шукати</label><select id="search-mode" name="mode">
      <option value="title">За назвою</option><option value="ingredient">За інгредієнтом</option><option value="category">За категорією</option>
    </select></div>
    <div><label id="search-text-label" for="search-text">Назва рецепта</label><input id="search-text" name="q" maxlength="100" aria-describedby="search-hint"></div>
    <div><label for="search-category">Категорія</label><select id="search-category" name="category_id"><option value="">Усі категорії</option></select></div>
    <div><label for="search-tag">Тег</label><select id="search-tag" name="tag_id"><option value="">Усі теги</option></select></div>
    <div><label for="search-time">До скількох хвилин</label><input id="search-time" name="max_cooking_time" type="number" min="1" max="1440" step="1"></div>
    <div><label for="search-sort">Сортувати</label><select id="search-sort" name="sort"><option value="newest">Спочатку нові</option><option value="title">За назвою</option></select></div>
  </div>
  <p id="search-hint" class="muted">Порожнє поле назви показує весь каталог. Фільтри можна поєднувати.</p>
  <div class="actions"><button id="search-submit" type="submit" disabled>Знайти</button><button id="reset-search" class="secondary" type="button">Скинути фільтри</button></div>
</form>
<div id="recipe-list" class="recipe-grid" aria-live="polite"></div>
<p id="list-status" role="status">Завантажуємо рецепти…</p>
<div class="pagination"><button id="previous-page" type="button" hidden>Назад</button><span id="page-number"></span><button id="next-page" type="button" hidden>Далі</button></div>
<p id="page-error" class="message error" role="alert" hidden></p>
{% endblock %}
{% block scripts %}<script type="module" src="{{ url_for('static', path='/js/catalog.js') }}?v={{ request.app.version }}"></script>{% endblock %}
